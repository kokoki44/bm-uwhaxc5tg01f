[package]
name = "bus-manager"
version = "0.0.0"
description = "Bus-Manager"
edition = "2021"

[lib]
name = "bus_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
