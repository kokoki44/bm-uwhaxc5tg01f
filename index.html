<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus-Manager</title>
    <style>
      :root { --text: #1b1b1b; --rand: #8a8a8a; --akzent: #0b5394; --fehler: #a4161a; --flaeche: #ffffff; --kopf: 52px; }
      html, body { margin: 0; height: 100%; width: 100%; font-family: system-ui, sans-serif; color: var(--text); font-size: 15px; }
      #map { position: absolute; inset: 0; }
      body.im-spiel #map { top: var(--kopf); }
      button, input, select { font: inherit; color: inherit; }
      button { background: var(--flaeche); border: 1px solid var(--rand); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      button[aria-pressed="true"] { background: var(--akzent); color: #fff; border-color: var(--akzent); font-weight: 700; text-decoration: underline; }
      :focus-visible { outline: 3px solid #e8a400; outline-offset: 2px; }
      #kopfleiste { position: absolute; top: 0; left: 0; right: 0; height: var(--kopf); display: none; align-items: center; gap: 18px;
        padding: 0 12px; background: var(--flaeche); border-bottom: 1px solid #c8c8c8; z-index: 3; box-sizing: border-box; }
      body.im-spiel #kopfleiste { display: flex; }
      #kopfleiste .feld { display: flex; flex-direction: column; line-height: 1.2; }
      #kopfleiste .klein { font-size: 12px; color: #444; }
      #kopfleiste .firma { display: flex; align-items: center; gap: 6px; font-weight: 700; }
      #kopfleiste .farbfeld { width: 14px; height: 14px; border: 1px solid #333; display: inline-block; }
      #zeitsteuerung { display: flex; gap: 4px; }
      #status { position: absolute; bottom: 8px; left: 8px; z-index: 2; background: rgba(255,255,255,.94); padding: 6px 10px;
        border-radius: 4px; font-size: 12px; line-height: 1.4; max-width: 60ch; }
      .dialog { max-width: 520px; width: calc(100% - 40px); border: 1px solid var(--rand); border-radius: 6px; padding: 18px 22px; }
      .dialog::backdrop { background: rgba(30, 40, 50, .35); }
      .dialog h1 { font-size: 20px; margin: 0 0 12px; }
      .dialog fieldset { border: 0; padding: 0; margin: 0 0 12px; }
      .dialog label { display: block; margin: 10px 0 4px; font-weight: 600; }
      .dialog legend { font-weight: 600; margin-bottom: 4px; }
      .dialog .option { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 4px 0; }
      .dialog input[type=text], .dialog input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--rand); border-radius: 4px; }
      .dialog .hilfe { font-size: 12px; color: #444; margin: 2px 0 0; }
      .dialog .fehler { color: var(--fehler); font-size: 13px; margin: 4px 0 0; }
      .dialog .fehler::before { content: "⚠ "; }
      .dialog .aktionen { margin-top: 16px; display: flex; justify-content: flex-end; }
      .dialog .primaer { background: var(--akzent); color: #fff; border-color: var(--akzent); padding: 8px 16px; font-weight: 700; }
      progress { width: 100%; height: 14px; }
      .fenster { position: absolute; top: calc(var(--kopf) + 12px); right: 12px; z-index: 4; background: var(--flaeche); border: 1px solid var(--rand);
        border-radius: 6px; padding: 12px 16px; min-width: 260px; max-width: 420px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
      .fenster header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .fenster h2 { font-size: 17px; margin: 0; }
      .fenster ul { padding-left: 18px; }
      .fenster.links { right: auto; left: 12px; max-width: 520px; }
      .rollen { max-height: 55vh; overflow: auto; }
      .rollen.kurz { max-height: 30vh; }
      .tabelle { border-collapse: collapse; font-size: 13px; }
      .tabelle th, .tabelle td { padding: 3px 6px; border-bottom: 1px solid #e2e2e2; text-align: left; vertical-align: top; }
      .tabelle td.zahl { text-align: right; white-space: nowrap; }
      .tabelle button { text-align: left; }
      .werte { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0; font-size: 13px; }
      .werte dt { font-weight: 600; }
      .werte dd { margin: 0; }
      .zweispaltig { display: grid; grid-template-columns: 1fr 110px; gap: 4px 8px; align-items: center; margin: 6px 0; font-size: 13px; }
      .zweispaltig input, .zweispaltig select { width: 100%; box-sizing: border-box; padding: 3px; }
      .meldung { color: var(--fehler); font-size: 13px; min-height: 1em; }
      .hilfe { font-size: 12px; color: #444; }
      .erfolg { color: #1b5e20; font-size: 13px; min-height: 1em; }
      .editor-rechts .werte { grid-template-columns: 1fr 1fr; }
      .fett { font-weight: 700; }
      .ok { color: #1b5e20; font-weight: 700; }
      .schlecht { color: var(--fehler); font-weight: 700; }
      .warnung { color: #7a4b00; }
      .primaer { background: var(--akzent); color: #fff; border-color: var(--akzent); font-weight: 700; }
      .aktionen { display: flex; justify-content: flex-end; gap: 8px; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      #kopfleiste .menue { display: flex; gap: 4px; }
      #editor { position: absolute; top: var(--kopf); left: 0; right: 0; bottom: 0; z-index: 3; background: #eef0f2;
        display: grid; grid-template-columns: 290px 1fr 330px; }
      body.im-editor .fenster { z-index: 5; }
      #editor aside { background: var(--flaeche); overflow: auto; padding: 10px 12px; font-size: 13px; }
      .editor-links { border-right: 1px solid #c8c8c8; }
      .editor-rechts { border-left: 1px solid #c8c8c8; }
      .editor-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .editor-kopf h2 { font-size: 17px; margin: 0; }
      #editor h3 { font-size: 14px; margin: 12px 0 4px; }
      #editor .werkzeuge { border: 1px solid #d6d6d6; border-radius: 4px; margin: 8px 0; padding: 4px 8px; }
      #editor .option { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }
      #editor .farbfeld { width: 14px; height: 14px; border: 1px solid #333; display: inline-block; flex: none; }
      .editor-mitte { position: relative; overflow: hidden; }
      .editor-mitte svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; font-family: system-ui, sans-serif; }
      .listeneintrag { display: block; width: 100%; text-align: left; margin: 2px 0; font-size: 12px; }
      #menueleiste { position: absolute; top: calc(var(--kopf) + 12px); left: 12px; z-index: 4; display: none; flex-direction: column; gap: 4px; }
      body.im-spiel #menueleiste { display: flex; }
      body.im-editor #menueleiste { display: none; }
      #menueleiste button { text-align: left; min-width: 130px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      .fenster.links { left: 160px; }
      .fenster.breit { max-width: min(920px, calc(100vw - 200px)); max-height: calc(100vh - var(--kopf) - 40px); overflow: auto; }
      .reiter { display: flex; gap: 4px; margin: 8px 0; }
      .spalten2 { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1fr); gap: 14px; }
      .farbpunkt { width: 12px; height: 12px; border: 1px solid #333; display: inline-block; vertical-align: middle; margin-right: 4px; }
      .filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; font-size: 13px; }
      .filter select { padding: 2px; }
      .optionen label { display: block; font-size: 13px; margin: 2px 0; }
      .gesperrt { color: #666; }
      tr.gewaehlt td { background: #e6eef8; }
    </style>
  </head>
  <body>
    <div id="kopfleiste" role="banner"></div>
    <div id="map"></div>
    <nav id="menueleiste"></nav>
    <div id="status" data-testid="status" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
